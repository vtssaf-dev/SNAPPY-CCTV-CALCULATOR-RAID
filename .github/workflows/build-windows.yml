name: Build SNAPPY CCTV Disk Calculator

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SNAPPY.CCTV.DiskCalculator/SNAPPY.CCTV.DiskCalculator.csproj

      - name: Publish Windows x64 EXE
        run: >-
          dotnet publish SNAPPY.CCTV.DiskCalculator/SNAPPY.CCTV.DiskCalculator.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          --output publish

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "publish/SNAPPY-CCTV-Disk-Calculator.exe"
          if (!(Test-Path $exe)) {
            Write-Error "SNAPPY-CCTV-Disk-Calculator.exe was not found."
            exit 1
          }
          $file = Get-Item $exe
          Write-Host "EXE: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Upload SNAPPY Calculator EXE
        uses: actions/upload-artifact@v4
        with:
          name: SNAPPY-CCTV-Disk-Calculator-Windows
          path: publish/SNAPPY-CCTV-Disk-Calculator.exe
          if-no-files-found: error
          retention-days: 3
