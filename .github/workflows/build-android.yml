name: Build SNAPPY CCTV Disk Calculator Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore SNAPPY.CCTV.DiskCalculator.Android/SNAPPY.CCTV.DiskCalculator.Android.csproj

      - name: Build Android APK
        run: dotnet build SNAPPY.CCTV.DiskCalculator.Android/SNAPPY.CCTV.DiskCalculator.Android.csproj -c Release -f net10.0-android --no-restore

      - name: Locate APK
        shell: bash
        run: find SNAPPY.CCTV.DiskCalculator.Android/bin/Release -name '*.apk' -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SNAPPY-CCTV-Disk-Calculator-Android
          path: SNAPPY.CCTV.DiskCalculator.Android/bin/Release/**/*.apk
          if-no-files-found: error
          retention-days: 7
